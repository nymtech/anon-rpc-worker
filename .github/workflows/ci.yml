name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # drives the non-gating e2e only

permissions:
  contents: read

jobs:
  build-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Build (prints the keccak256 workerHash)
        run: pnpm build
      - name: Bundle assertions
        run: |
          f=dist/nym-anon-rpc-worker.js
          test -f "$f"
          # mix-fetch inlines the WASM, so the bundle is large; a tiny bundle
          # means the WASM did not embed.
          size=$(wc -c < "$f")
          test "$size" -gt 10000000 || { echo "bundle too small ($size bytes): WASM not embedded?"; exit 1; }
          echo "worker bundle OK ($(du -h "$f" | cut -f1)); node $(node -v); esbuild $(pnpm exec esbuild --version)"
      - run: pnpm test

  e2e:
    # Non-gating: needs the live Nym mixnet, which has weather. Runs nightly and
    # on demand, and self-gates on directory/epoch health.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e against the live Nym mixnet
        run: pnpm test:e2e
